<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sort the Numbers | @KK</title>
        <link rel="stylesheet" href="logo-style.css" />
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <button class="fa-solid fa-arrow-right-rotate loader"></button>

        <button class="logo">
            <div class="logo-text">L O T U S</div>
            <div class="logo-container">
                <div class="element-container">
                    <div class="logo-element element-left"></div>
                    <div class="logo-element element-mid-left"></div>
                    <div class="logo-element element-mid"></div>
                    <div class="logo-element element-mid-right"></div>
                    <div class="logo-element element-right"></div>
                    <div class="element-circle"></div>
                </div>
                <div class="leaf-container">
                    <div class="leaves leaf-1"></div>
                    <div class="leaves leaf-2"></div>
                    <div class="leaves leaf-3"></div>
                    <div class="leaves leaf-4"></div>
                </div>
                <div class="element-stick"></div>
                <div class="status">
                    <div class="all-status youtube-status">
                        <a
                            class="fa-brands fa-youtube"
                            href="https://www.youtube.com/@Lotus_YT_Official"
                            target="_blank"
                        ></a>
                    </div>
                    <div class="all-status instagram-status">
                        <a
                            class="fa-brands fa-instagram"
                            href="https://www.instagram.com/ig_lotus_official/"
                            target="_blank"
                        ></a>
                    </div>
                    <div class="all-status facebook-status">
                        <a
                            class="fa-brands fa-facebook-f"
                            href="https://www.facebook.com/LotusFacebook"
                            target="_blank"
                        ></a>
                    </div>
                    <div class="all-status twitter-status">
                        <a
                            class="fa-brands fa-x-twitter"
                            href="https://twitter.com/LOTUS_Twitty"
                            target="_blank"
                        ></a>
                    </div>
                </div>
            </div>
        </button>

        <div class="pop-up">
            <div class="cross"><a class="fa-solid fa-xmark"></a></div>
            <div class="box">
                <h1>Congratulations!</h1>
                <br />
                <h2>You Won the Game!</h2>
                <br />
                <br />
                <br />
                <h3>
                    It took you <b class="moves-count">0</b> Moves and
                    <b class="time-count">0:00</b> Minutes of time
                </h3>
                <h3>to Solve the Entire Puzzle.</h3>
                <br />
                <h3>
                    You are among the top <b class="top-perc">0.01%</b> of the
                    Players!
                </h3>
                <br />
                <br />
                <div class="btns">
                    <button class="play-again">Play Again</button>
                    <button class="continue">Continue</button>
                </div>
            </div>
        </div>

        <div class="container">
            <span class="header">
                <h1 class="heading">Sort the Numbers</h1>
                <hr />
                <h3 class="heading credits">
                    A Puzzle Game by
                    <b
                        ><a
                            href="https://www.linkedin.com/in/koustab-koley/"
                            target="_blank"
                            style="text-decoration: none; color: #339299"
                            >@Koustab Koley</a
                        ></b
                    >
                </h3>
            </span>
        </div>

        <div class="basket">
            <div class="frame">
                <div class="bar">
                    <div class="fill"></div>
                </div>
                <div class="holder">
                    <div class="number slider num1" id="index1">1</div>
                    <div class="number slider num2" id="index2">2</div>
                    <div class="number slider num3" id="index3">3</div>
                    <div class="number slider num4" id="index4">4</div>
                    <div class="number slider num5" id="index5">5</div>
                    <div class="number slider num6" id="index6">6</div>
                    <div class="number slider num7" id="index7">7</div>
                    <div class="number slider num8" id="index8">8</div>
                    <div class="number slider num9" id="index9">9</div>
                    <div class="number slider num10" id="index10">10</div>
                    <div class="number slider num11" id="index11">11</div>
                    <div class="number slider num12" id="index12">12</div>
                    <div class="number slider num13" id="index13">13</div>
                    <div class="number slider num14" id="index14">14</div>
                    <div class="number slider num15" id="index15">15</div>
                    <div class="number" id="index16 block"></div>
                </div>
                <div class="holder-arrow">
                    <div class="arrows arrow1">
                        <a class="fa-solid fa-square-caret-left"></a>
                    </div>
                    <div class="arrows arrow2">
                        <a class="fa-solid fa-square-caret-up"></a>
                    </div>
                    <div class="arrows arrow3">
                        <a class="fa-solid fa-square-caret-down"></a>
                    </div>
                    <div class="arrows arrow4">
                        <a class="fa-solid fa-square-caret-right"></a>
                    </div>
                </div>
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
